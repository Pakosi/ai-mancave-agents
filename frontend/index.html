<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WOYS Chat</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8fafc;
      margin: 2rem;
      color: #1f2937;
    }

    main {
      max-width: 42rem;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.75rem;
      margin: 0 0 1rem;
    }

    form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    input {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      flex: 1;
      font: inherit;
      padding: 0.75rem;
    }

    select {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font: inherit;
      padding: 0.75rem;
    }

    button {
      background: #2563eb;
      border: 0;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font: inherit;
      padding: 0.75rem 1rem;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .error {
      color: #b91c1c;
      min-height: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .messages {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .message {
      align-self: flex-start;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      max-width: 85%;
      padding: 1rem;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .message.agent {
      align-self: flex-start;
    }

    .message.agent-host {
      background: #ecfdf5;
      border-color: #a7f3d0;
    }

    .message.agent-assistant {
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .message.agent-sales {
      background: #fff7ed;
      border-color: #fed7aa;
    }

    .message-meta {
      color: #64748b;
      font-size: 0.8rem;
      margin-top: 0.5rem;
    }

    .empty {
      color: #64748b;
      padding: 1rem 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>WOYS</h1>

    <form id="messageForm">
      <select id="agentSelect" name="agent"></select>
      <select id="roomSelect" name="room">
        <option value="main">Main</option>
        <option value="sales">Sales</option>
        <option value="support">Support</option>
      </select>
      <input id="messageInput" name="message" type="text" placeholder="Write a message" autocomplete="off" required>
      <button id="sendButton" type="submit">Send</button>
    </form>

    <div id="error" class="error" role="status"></div>
    <div id="messages" class="messages" aria-live="polite"></div>
  </main>

  <script src="./app.js"></script>
  <script>
    const agentSelect = document.getElementById("agentSelect");
    const error = document.getElementById("error");
    const messageForm = document.getElementById("messageForm");
    const messageInput = document.getElementById("messageInput");
    const messages = document.getElementById("messages");
    const roomSelect = document.getElementById("roomSelect");
    const sendButton = document.getElementById("sendButton");

    roomSelect.value = WOYSApp.getSelectedRoomId();

    function setError(message) {
      error.textContent = message || "";
    }

    function formatTime(value) {
      return new Date(value).toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function renderMessages(items) {
      messages.textContent = "";

      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No messages yet.";
        messages.appendChild(empty);
        return;
      }

      items
        .slice()
        .sort((first, second) => new Date(first.createdAt) - new Date(second.createdAt))
        .forEach(item => {
          const view = WOYSApp.mapMessageForDisplay(item);
          const message = document.createElement("div");
          message.className = view.classes.join(" ");

          const text = document.createElement("div");
          text.textContent = view.text;

          const meta = document.createElement("div");
          meta.className = "message-meta";
          meta.textContent = formatTime(view.createdAt);

          message.append(text, meta);
          messages.appendChild(message);
        });
    }

    function loadMessages() {
      return WOYSApp.loadMessages({
        onMessages(items) {
          renderMessages(items);
          setError("");
        },
        onError(err) {
          console.error(err);
          setError("Could not load messages.");
        },
      }).catch(() => {});
    }

    function renderAgents(items) {
      agentSelect.textContent = "";

      items.forEach(item => {
        const optionData = WOYSApp.mapAgentForOption(item);
        const option = document.createElement("option");

        option.value = optionData.value;
        option.textContent = optionData.text;
        option.dataset.label = optionData.label;
        option.dataset.color = optionData.color;

        agentSelect.appendChild(option);
      });

      agentSelect.value = WOYSApp.getSelectedAgentId(items);
      WOYSApp.saveSelectedAgentId(agentSelect.value);
    }

    function loadAgents() {
      return WOYSApp.loadAgents({
        onAgents(items) {
          renderAgents(items);
          setError("");
        },
        onError(err) {
          console.error(err);
          setError("Could not load agents.");
        },
      }).catch(() => {});
    }

    function sendMessage(message) {
      const agentId = agentSelect.value;

      sendButton.disabled = true;

      WOYSApp.sendMessage(message, {
        onSent() {
          messageInput.value = "";
        },
        onError(err) {
          console.error(err);
          setError("Could not send message.");
        },
      })
        .then(() => {
          return WOYSApp.getAgentReply(agentId, message, {
            onError(err) {
              console.error(err);
              setError("Could not get agent reply.");
            },
          }).catch(() => {});
        })
        .then(() => {
          return loadMessages();
        })
        .catch(() => {})
        .finally(() => {
          sendButton.disabled = false;
          messageInput.focus();
        });
    }

    messageForm.addEventListener("submit", event => {
      event.preventDefault();

      const message = messageInput.value.trim();

      if (message === "") {
        return;
      }

      sendMessage(message);
    });

    agentSelect.addEventListener("change", () => {
      WOYSApp.saveSelectedAgentId(agentSelect.value);
    });

    roomSelect.addEventListener("change", () => {
      WOYSApp.saveSelectedRoomId(roomSelect.value);
      loadMessages();
    });

    loadAgents().then(loadMessages);
    setInterval(loadMessages, 2000);
  </script>
</body>
</html>
