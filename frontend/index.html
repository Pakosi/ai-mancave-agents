<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WOYS Room</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      margin: 0;
      color: #172033;
    }

    main {
      max-width: 72rem;
      margin: 0 auto;
      padding: 1.5rem;
    }

    h1 {
      font-size: 1.75rem;
      margin: 0;
    }

    .toolbar {
      align-items: center;
      display: flex;
      gap: 0.75rem;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .controls {
      align-items: center;
      display: flex;
      gap: 0.5rem;
    }

    .room-status {
      color: #475569;
      font-size: 0.82rem;
      font-weight: 700;
      min-height: 1.2rem;
    }

    .room-brief {
      color: #64748b;
      font-size: 0.86rem;
      line-height: 1.35;
      margin: -0.35rem 0 0.9rem;
      max-width: 44rem;
    }

    .room-notice {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      color: #475569;
      font-size: 0.82rem;
      min-height: 1.9rem;
      opacity: 0;
      padding: 0.45rem 0.7rem;
      transition: opacity 180ms ease;
    }

    .room-notice.visible {
      opacity: 1;
    }

    .layout {
      display: grid;
      gap: 1rem;
      grid-template-columns: minmax(0, 1fr) 20rem;
    }

    .room {
      background: linear-gradient(#f8fafc 0 68%, #dbe7d4 68% 100%);
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      min-height: 31rem;
      overflow: hidden;
      position: relative;
    }

    .room::before {
      background: #e2e8f0;
      content: "";
      height: 1px;
      left: 0;
      position: absolute;
      right: 0;
      top: 68%;
    }

    .table {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      bottom: 5.5rem;
      box-shadow: 0 16px 35px rgba(15, 23, 42, 0.12);
      height: 7rem;
      left: 50%;
      position: absolute;
      transform: translateX(-50%);
      width: 58%;
    }

    .agent-node {
      animation: agentIdle 4.8s ease-in-out infinite;
      position: absolute;
      transform: translate(-50%, -50%);
      width: 13rem;
    }

    .agent-node:nth-child(2) {
      animation-delay: 0.7s;
    }

    .agent-node:nth-child(3) {
      animation-delay: 1.4s;
    }

    .agent-node.latest .avatar {
      box-shadow: 0 0 0 7px rgba(37, 99, 235, 0.18), 0 10px 24px rgba(37, 99, 235, 0.22);
      transform: scale(1.1);
    }

    .agent-node.latest .speech {
      border-color: #2563eb;
      opacity: 1;
      transform: translateY(-0.2rem);
    }

    .agent-node.thinking .avatar {
      animation: thinkingPulse 1.1s ease-in-out infinite;
      box-shadow: 0 0 0 8px rgba(15, 23, 42, 0.1);
    }

    .speech {
      animation: bubbleIn 260ms ease-out;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.1);
      font-size: 0.88rem;
      line-height: 1.35;
      min-height: 4.25rem;
      opacity: 0.58;
      padding: 0.7rem;
      transition: border-color 180ms ease, opacity 180ms ease, transform 180ms ease;
    }

    .speech.thinking {
      color: #64748b;
      font-style: italic;
      opacity: 1;
    }

    .avatar-row {
      align-items: center;
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 0.6rem;
    }

    .avatar {
      align-items: center;
      border: 3px solid currentColor;
      border-radius: 50%;
      color: #334155;
      display: flex;
      font-weight: 700;
      height: 3.5rem;
      justify-content: center;
      transition: box-shadow 180ms ease, transform 180ms ease;
      width: 3.5rem;
    }

    .agent-name {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #d1d5db;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.35rem 0.55rem;
    }

    .agent-role {
      color: #64748b;
      font-size: 0.72rem;
      font-weight: 700;
      margin-top: 0.25rem;
      text-align: center;
    }

    .you-panel {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      bottom: 1rem;
      left: 1rem;
      max-width: 18rem;
      padding: 0.8rem;
      position: absolute;
    }

    .you-label {
      color: #475569;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .activity {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      min-height: 20rem;
      padding: 1rem;
    }

    .goals-panel,
    .memory-panel,
    .plan-panel,
    .tasks-panel {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 1rem;
    }

    .activity h2,
    .goals-panel h2,
    .memory-panel h2,
    .plan-panel h2,
    .tasks-panel h2 {
      font-size: 1rem;
      margin: 0 0 0.75rem;
    }

    .plan-objective {
      color: #172033;
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 0.8rem;
    }

    .phase-pill {
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      border-radius: 999px;
      color: #3730a3;
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 0.7rem;
      padding: 0.25rem 0.5rem;
      text-transform: uppercase;
    }

    .plan-group {
      margin-top: 0.7rem;
    }

    .plan-label {
      color: #64748b;
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
      text-transform: uppercase;
    }

    .plan-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin: 0;
      padding: 0;
    }

    .plan-list li {
      border-left: 2px solid #cbd5e1;
      font-size: 0.82rem;
      line-height: 1.3;
      list-style: none;
      padding-left: 0.5rem;
    }

    .memory-section {
      margin-top: 0.8rem;
    }

    .memory-section:first-child {
      margin-top: 0;
    }

    .memory-title {
      color: #64748b;
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 0.45rem;
      text-transform: uppercase;
    }

    .memory-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .memory-item {
      border-left: 2px solid #cbd5e1;
      padding-left: 0.55rem;
    }

    .memory-item-title {
      font-size: 0.84rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .memory-item-summary {
      color: #475569;
      font-size: 0.8rem;
      line-height: 1.3;
      margin-top: 0.2rem;
    }

    .memory-meta {
      color: #64748b;
      font-size: 0.72rem;
      font-weight: 700;
      margin-top: 0.25rem;
    }

    .goal-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .goal-item {
      border-left: 2px solid #cbd5e1;
      padding-left: 0.55rem;
    }

    .goal-title {
      font-size: 0.84rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .goal-meta {
      color: #64748b;
      font-size: 0.72rem;
      font-weight: 700;
      margin-top: 0.25rem;
      text-transform: capitalize;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .task-item {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.7rem;
      transition: background 180ms ease, border-color 180ms ease;
    }

    .task-item.recent {
      background: #ecfdf5;
      border-color: #10b981;
    }

    .task-title {
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.35rem;
    }

    .task-meta {
      color: #64748b;
      font-size: 0.78rem;
      margin-bottom: 0.55rem;
      text-transform: capitalize;
    }

    .task-action {
      background: #0f766e;
      font-size: 0.8rem;
      padding: 0.5rem 0.65rem;
      width: 100%;
    }

    .activity-feed {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      max-height: 27rem;
      overflow: auto;
    }

    .feed-item {
      border-left: 3px solid #cbd5e1;
      font-size: 0.88rem;
      line-height: 1.35;
      padding-left: 0.65rem;
    }

    .feed-item.agent-host {
      border-color: #10b981;
    }

    .feed-item.agent-assistant {
      border-color: #3b82f6;
    }

    .feed-item.agent-sales {
      border-color: #f97316;
    }

    .feed-meta {
      color: #64748b;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
    }

    form {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      display: grid;
      gap: 0.6rem;
      grid-template-columns: 1fr 1fr;
      padding: 1rem;
    }

    input {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font: inherit;
      grid-column: 1 / -1;
      padding: 0.75rem;
    }

    select {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font: inherit;
      padding: 0.7rem;
      width: 100%;
    }

    button {
      background: #2563eb;
      border: 0;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font: inherit;
      grid-column: 1 / -1;
      padding: 0.75rem 1rem;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .error {
      color: #b91c1c;
      min-height: 1.4rem;
      margin-bottom: 0.75rem;
    }

    .empty {
      color: #64748b;
      font-size: 0.9rem;
    }

    @keyframes agentIdle {
      0%, 100% {
        margin-top: 0;
      }

      50% {
        margin-top: -0.35rem;
      }
    }

    @keyframes bubbleIn {
      from {
        opacity: 0;
        transform: translateY(0.35rem);
      }

      to {
        opacity: 0.58;
        transform: translateY(0);
      }
    }

    @keyframes thinkingPulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }

    @media (max-width: 860px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .room {
        min-height: 38rem;
      }

      .agent-node {
        width: 11rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="toolbar">
      <h1>WOYS Room</h1>
      <div class="controls">
        <div id="activeRoom" class="room-status">Active room</div>
        <div id="roomNotice" class="room-notice" aria-live="polite"></div>
        <select id="roomSelect" name="room"></select>
      </div>
    </div>

    <div id="error" class="error" role="status"></div>
    <div id="roomBrief" class="room-brief"></div>

    <div class="layout">
      <section class="room" aria-label="Agent brainstorming room">
        <div class="table"></div>
        <div id="roomAgents"></div>
        <div class="you-panel">
          <div class="you-label">You</div>
          <div id="youMessage" class="empty">No message yet.</div>
        </div>
      </section>

      <aside class="sidebar">
        <form id="messageForm">
          <select id="agentSelect" name="agent"></select>
          <input id="messageInput" name="message" type="text" placeholder="Write a message" autocomplete="off" required>
          <button id="sendButton" type="submit">Send into room</button>
        </form>

        <section class="tasks-panel">
          <h2>Tasks</h2>
          <div id="taskList" class="task-list"></div>
        </section>

        <section class="plan-panel">
          <h2>Company Plan</h2>
          <div id="companyPlan"></div>
        </section>

        <section class="goals-panel">
          <h2>Agent Goals</h2>
          <div id="agentGoals"></div>
        </section>

        <section class="memory-panel">
          <h2>Decisions / Memory</h2>
          <div id="decisionMemory"></div>
        </section>

        <section class="activity">
          <h2>Activity</h2>
          <div id="activityFeed" class="activity-feed" aria-live="polite"></div>
        </section>
      </aside>
    </div>
  </main>

  <script src="./app.js"></script>
  <script>
    const activityFeed = document.getElementById("activityFeed");
    const activeRoom = document.getElementById("activeRoom");
    const agentSelect = document.getElementById("agentSelect");
    const agentGoals = document.getElementById("agentGoals");
    const companyPlan = document.getElementById("companyPlan");
    const decisionMemory = document.getElementById("decisionMemory");
    const error = document.getElementById("error");
    const messageForm = document.getElementById("messageForm");
    const messageInput = document.getElementById("messageInput");
    const roomAgents = document.getElementById("roomAgents");
    const roomBrief = document.getElementById("roomBrief");
    const roomNotice = document.getElementById("roomNotice");
    const roomSelect = document.getElementById("roomSelect");
    const sendButton = document.getElementById("sendButton");
    const taskList = document.getElementById("taskList");
    const youMessage = document.getElementById("youMessage");
    let loadedAgents = [];
    let loadedRooms = [];
    let currentMessages = [];
    let currentDecisions = [];
    let currentAgentGoals = [];
    let currentMemoryEvents = [];
    let currentRhythm = {};
    let autonomousThinkingAgentId = "";
    let manualThinkingAgentId = "";

    function setError(message) {
      error.textContent = message || "";
    }

    function formatTime(value) {
      return new Date(value).toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function renderRoom(items) {
      const newestAgentMessage = WOYSApp.getNewestAgentMessage(items);

      roomAgents.textContent = "";
      youMessage.textContent = WOYSApp.getLatestUserMessage(items) || "No message yet.";

      loadedAgents.forEach(agent => {
        const thinkingAgentId = manualThinkingAgentId || autonomousThinkingAgentId;
        const roomAgent = WOYSApp.mapAgentForRoom(agent, items);
        const node = document.createElement("div");
        node.className = "agent-node";

        if (newestAgentMessage && newestAgentMessage.agentId === roomAgent.id) {
          node.classList.add("latest");
        }

        if (thinkingAgentId === roomAgent.id) {
          node.classList.add("thinking");
        }

        node.style.left = roomAgent.position.left;
        node.style.top = roomAgent.position.top;

        const speech = document.createElement("div");
        speech.className = "speech";

        if (thinkingAgentId === roomAgent.id) {
          speech.classList.add("thinking");
          speech.textContent = "thinking...";
        } else {
          speech.textContent = roomAgent.latestMessage;
        }

        const avatarRow = document.createElement("div");
        avatarRow.className = "avatar-row";

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.style.color = roomAgent.color;
        avatar.textContent = roomAgent.label.slice(0, 1);

        const name = document.createElement("div");
        name.className = "agent-name";
        name.textContent = roomAgent.name;

        avatarRow.append(avatar, name);

        const role = document.createElement("div");
        role.className = "agent-role";
        role.textContent = roomAgent.role;

        node.append(speech, avatarRow, role);
        roomAgents.appendChild(node);
      });
    }

    function renderActivity(items) {
      activityFeed.textContent = "";

      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No activity yet.";
        activityFeed.appendChild(empty);
        return;
      }

      items
        .slice()
        .sort((first, second) => new Date(second.createdAt) - new Date(first.createdAt))
        .slice(0, 20)
        .forEach(item => {
          const view = WOYSApp.mapMessageForDisplay(item);
          const feedItem = document.createElement("div");
          feedItem.className = view.classes
            .map(className => className === "message" ? "feed-item" : className)
            .join(" ");

          const meta = document.createElement("div");
          meta.className = "feed-meta";
          meta.textContent = formatTime(view.createdAt);

          const text = document.createElement("div");
          text.textContent = view.text;

          feedItem.append(meta, text);
          activityFeed.appendChild(feedItem);
        });
    }

    function renderMessages(items) {
      currentMessages = items;
      renderRoom(items);
      renderActivity(items);
    }

    function renderTasks(items) {
      taskList.textContent = "";

      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No tasks yet.";
        taskList.appendChild(empty);
        return;
      }

      items.forEach(item => {
        const view = WOYSApp.mapTaskForDisplay(item, loadedAgents);
        const taskItem = document.createElement("div");
        taskItem.className = "task-item";

        if (view.isRecentlyUpdated) {
          taskItem.classList.add("recent");
        }

        const title = document.createElement("div");
        title.className = "task-title";
        title.textContent = view.title;

        const meta = document.createElement("div");
        meta.className = "task-meta";
        meta.textContent = `${view.assignedAgent} · ${view.statusText}`;

        taskItem.append(title, meta);

        if (view.nextStatus) {
          const button = document.createElement("button");
          button.className = "task-action";
          button.type = "button";
          button.dataset.taskId = view.id;
          button.dataset.status = view.nextStatus;
          button.textContent = `Mark ${view.nextStatusText}`;
          taskItem.appendChild(button);
        }

        taskList.appendChild(taskItem);
      });
    }

    function renderPlanList(labelText, items) {
      const group = document.createElement("div");
      group.className = "plan-group";

      const label = document.createElement("div");
      label.className = "plan-label";
      label.textContent = labelText;

      const list = document.createElement("ul");
      list.className = "plan-list";

      if (items.length === 0) {
        const empty = document.createElement("li");
        empty.textContent = "None yet.";
        list.appendChild(empty);
      } else {
        items.slice(0, 3).forEach(item => {
          const listItem = document.createElement("li");
          listItem.textContent = item;
          list.appendChild(listItem);
        });
      }

      group.append(label, list);

      return group;
    }

    function renderCompanyPlan(plan) {
      const view = WOYSApp.mapCompanyPlanForDisplay(plan);

      companyPlan.textContent = "";

      const rhythm = WOYSApp.mapOperatingRhythmForDisplay(currentRhythm);
      const phase = document.createElement("div");
      phase.className = "phase-pill";
      phase.textContent = `${rhythm.phase} · ${rhythm.cycleText}`;

      const objective = document.createElement("div");
      objective.className = "plan-objective";
      objective.textContent = view.currentObjective;

      companyPlan.append(
        phase,
        objective,
        renderPlanList("Priorities", view.activePriorities),
        renderPlanList("Risks", view.keyRisks),
        renderPlanList("Next actions", view.nextRecommendedActions),
        renderPlanList("Decisions", view.recentDecisions),
      );
    }

    function renderAgentGoals() {
      agentGoals.textContent = "";

      if (currentAgentGoals.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No goals yet.";
        agentGoals.appendChild(empty);
        return;
      }

      const list = document.createElement("div");
      list.className = "goal-list";

      currentAgentGoals.slice(0, 5).forEach(goal => {
        const view = WOYSApp.mapAgentGoalForDisplay(goal, loadedAgents);
        const item = document.createElement("div");
        item.className = "goal-item";

        const title = document.createElement("div");
        title.className = "goal-title";
        title.textContent = `${view.agentName}: ${view.currentGoal}`;

        const meta = document.createElement("div");
        meta.className = "goal-meta";
        meta.textContent = `${view.status} · ${view.activeRoomId} · ${view.focusArea}`;

        item.append(title, meta);
        list.appendChild(item);
      });

      agentGoals.appendChild(list);
    }

    function renderMemorySection(titleText, items, mapItem) {
      const section = document.createElement("div");
      section.className = "memory-section";

      const title = document.createElement("div");
      title.className = "memory-title";
      title.textContent = titleText;

      const list = document.createElement("div");
      list.className = "memory-list";

      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "None yet.";
        list.appendChild(empty);
      } else {
        items.slice(0, 3).forEach(item => {
          const view = mapItem(item);
          const node = document.createElement("div");
          node.className = "memory-item";

          const itemTitle = document.createElement("div");
          itemTitle.className = "memory-item-title";
          itemTitle.textContent = view.title || view.summary;

          const summary = document.createElement("div");
          summary.className = "memory-item-summary";
          summary.textContent = view.title ? view.summary : "";

          const meta = document.createElement("div");
          meta.className = "memory-meta";
          meta.textContent = view.meta;

          node.append(itemTitle);

          if (summary.textContent !== "") {
            node.appendChild(summary);
          }

          node.appendChild(meta);
          list.appendChild(node);
        });
      }

      section.append(title, list);

      return section;
    }

    function renderDecisionMemory() {
      decisionMemory.textContent = "";
      decisionMemory.append(
        renderMemorySection("Decisions", currentDecisions, WOYSApp.mapDecisionForDisplay),
        renderMemorySection("Memory", currentMemoryEvents, WOYSApp.mapMemoryEventForDisplay),
      );
    }

    function renderRoomActivity(activity) {
      const view = WOYSApp.getRoomActivityView(activity, roomSelect.value, loadedRooms);

      activeRoom.textContent = view.activeRoomText;
      roomNotice.textContent = view.noticeText;
      roomNotice.classList.toggle("visible", view.noticeText !== "");
    }

    function renderRoomBrief() {
      const room = WOYSApp.getSelectedRoom(loadedRooms, roomSelect.value);

      roomBrief.textContent = room && room.brief ? room.brief : "";
    }

    function loadMessages() {
      return WOYSApp.loadMessages({
        onActivity(activity) {
          autonomousThinkingAgentId = activity.isThinking ? activity.nextAgentId : "";
          renderRoomActivity(activity);
        },
        onMessages(items) {
          renderMessages(items);
          setError("");
        },
        onError(err) {
          console.error(err);
          setError("Could not load messages.");
        },
      }).catch(() => {});
    }

    function loadTasks() {
      return WOYSApp.loadTasks({
        onTasks(items) {
          renderTasks(items);
          setError("");
        },
        onError(err) {
          console.error(err);
          setError("Could not load tasks.");
        },
      }).catch(() => {});
    }

    function loadCompanyPlan() {
      let loadedPlan = null;

      return Promise.all([
        WOYSApp.loadOperatingRhythm({
          onRhythm(rhythm) {
            currentRhythm = rhythm;
          },
          onError(err) {
            console.error(err);
            setError("Could not load operating rhythm.");
          },
        }).catch(() => {}),
        WOYSApp.loadCompanyPlan({
          onPlan(plan) {
            loadedPlan = plan;
            setError("");
          },
          onError(err) {
            console.error(err);
            setError("Could not load company plan.");
          },
        }).catch(() => {}),
      ]).then(() => {
        renderCompanyPlan(loadedPlan || {});
      });
    }

    function loadAgentGoals() {
      return WOYSApp.loadAgentGoals({
        onGoals(items) {
          currentAgentGoals = items;
          renderAgentGoals();
          setError("");
        },
        onError(err) {
          console.error(err);
          setError("Could not load agent goals.");
        },
      }).catch(() => {});
    }

    function loadDecisionMemory() {
      return Promise.all([
        WOYSApp.loadDecisions({
          roomId: roomSelect.value,
          onDecisions(items) {
            currentDecisions = items;
          },
          onError(err) {
            console.error(err);
            setError("Could not load decisions.");
          },
        }).catch(() => []),
        WOYSApp.loadMemoryEvents({
          roomId: roomSelect.value,
          onMemoryEvents(items) {
            currentMemoryEvents = items;
          },
          onError(err) {
            console.error(err);
            setError("Could not load memory events.");
          },
        }).catch(() => []),
      ]).then(() => {
        renderDecisionMemory();
      });
    }

    function renderAgents(items) {
      loadedAgents = items;
      agentSelect.textContent = "";

      items.forEach(item => {
        const optionData = WOYSApp.mapAgentForOption(item);
        const option = document.createElement("option");

        option.value = optionData.value;
        option.textContent = optionData.text;
        option.dataset.label = optionData.label;
        option.dataset.color = optionData.color;
        option.dataset.role = optionData.role;

        agentSelect.appendChild(option);
      });

      agentSelect.value = WOYSApp.getSelectedAgentId(items);
      WOYSApp.saveSelectedAgentId(agentSelect.value);
      renderRoom([]);
    }

    function renderRooms(items) {
      loadedRooms = items;
      roomSelect.textContent = "";

      items.forEach(item => {
        const optionData = WOYSApp.mapRoomForOption(item);
        const option = document.createElement("option");

        option.value = optionData.value;
        option.textContent = optionData.text;

        roomSelect.appendChild(option);
      });

      roomSelect.value = WOYSApp.getSelectedRoomId(items);
      WOYSApp.saveSelectedRoomId(roomSelect.value);
      renderRoomBrief();
      renderRoomActivity({});
    }

    function loadAgents() {
      return WOYSApp.loadAgents({
        onAgents(items) {
          renderAgents(items);
          setError("");
        },
        onError(err) {
          console.error(err);
          setError("Could not load agents.");
        },
      }).catch(() => {});
    }

    function loadRooms() {
      return WOYSApp.loadRooms({
        onRooms(items) {
          renderRooms(items);
          setError("");
        },
        onError(err) {
          console.error(err);
          setError("Could not load rooms.");
        },
      }).catch(() => {});
    }

    function sendMessage(message) {
      const agentId = agentSelect.value;

      manualThinkingAgentId = agentId;
      renderRoom(currentMessages);
      sendButton.disabled = true;

      WOYSApp.sendMessage(message, {
        onSent() {
          messageInput.value = "";
        },
        onError(err) {
          console.error(err);
          setError("Could not send message.");
        },
      })
        .then(() => {
          return WOYSApp.getAgentReply(agentId, message, {
            onError(err) {
              console.error(err);
              setError("Could not get agent reply.");
            },
          }).catch(() => {});
        })
        .then(() => {
          return Promise.all([loadMessages(), loadTasks(), loadCompanyPlan(), loadAgentGoals(), loadDecisionMemory()]);
        })
        .catch(() => {})
        .finally(() => {
          manualThinkingAgentId = "";
          renderRoom(currentMessages);
          sendButton.disabled = false;
          messageInput.focus();
        });
    }

    messageForm.addEventListener("submit", event => {
      event.preventDefault();

      const message = messageInput.value.trim();

      if (message === "") {
        return;
      }

      sendMessage(message);
    });

    agentSelect.addEventListener("change", () => {
      WOYSApp.saveSelectedAgentId(agentSelect.value);
    });

    roomSelect.addEventListener("change", () => {
      WOYSApp.saveSelectedRoomId(roomSelect.value);
      autonomousThinkingAgentId = "";
      renderRoomBrief();
      Promise.all([loadMessages(), loadTasks(), loadCompanyPlan(), loadAgentGoals(), loadDecisionMemory()]);
    });

    taskList.addEventListener("click", event => {
      const button = event.target.closest("button[data-task-id]");

      if (!button) {
        return;
      }

      button.disabled = true;
      WOYSApp.updateTaskStatus(button.dataset.taskId, button.dataset.status, {
        onError(err) {
          console.error(err);
          setError("Could not update task.");
        },
      })
        .then(() => Promise.all([loadTasks(), loadMessages(), loadCompanyPlan(), loadAgentGoals(), loadDecisionMemory()]))
        .catch(() => {})
        .finally(() => {
          button.disabled = false;
        });
    });

    Promise.all([loadAgents(), loadRooms()]).then(() => Promise.all([
      loadMessages(),
      loadTasks(),
      loadCompanyPlan(),
      loadAgentGoals(),
      loadDecisionMemory(),
    ]));
    setInterval(loadMessages, 2000);
    setInterval(loadTasks, 4000);
    setInterval(loadCompanyPlan, 5000);
    setInterval(loadAgentGoals, 5000);
    setInterval(loadDecisionMemory, 5000);
  </script>
</body>
</html>
