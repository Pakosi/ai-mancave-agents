<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WOYS Chat</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8fafc;
      margin: 2rem;
      color: #1f2937;
    }

    main {
      max-width: 42rem;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.75rem;
      margin: 0 0 1rem;
    }

    form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    input {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      flex: 1;
      font: inherit;
      padding: 0.75rem;
    }

    button {
      background: #2563eb;
      border: 0;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font: inherit;
      padding: 0.75rem 1rem;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .error {
      color: #b91c1c;
      min-height: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .messages {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .message {
      align-self: flex-start;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      max-width: 85%;
      padding: 1rem;
      word-break: break-word;
    }

    .message.agent {
      align-self: flex-end;
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .message-meta {
      color: #64748b;
      font-size: 0.8rem;
      margin-top: 0.5rem;
    }

    .empty {
      color: #64748b;
      padding: 1rem 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>WOYS</h1>

    <form id="messageForm">
      <input id="messageInput" name="message" type="text" placeholder="Write a message" autocomplete="off" required>
      <button id="sendButton" type="submit">Send</button>
    </form>

    <div id="error" class="error" role="status"></div>
    <div id="messages" class="messages" aria-live="polite"></div>
  </main>

  <script src="./app.js"></script>
  <script>
    const error = document.getElementById("error");
    const messageForm = document.getElementById("messageForm");
    const messageInput = document.getElementById("messageInput");
    const messages = document.getElementById("messages");
    const sendButton = document.getElementById("sendButton");
    const agentReplies = [];

    function setError(message) {
      error.textContent = message || "";
    }

    function formatTime(value) {
      return new Date(value).toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function renderMessages(items) {
      messages.textContent = "";

      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No messages yet.";
        messages.appendChild(empty);
        return;
      }

      items
        .slice()
        .sort((first, second) => new Date(first.createdAt) - new Date(second.createdAt))
        .forEach(item => {
          const message = document.createElement("div");
          message.className = "message";

          if (item.source === "agent") {
            message.classList.add("agent");
          }

          const text = document.createElement("div");
          text.textContent = item.message;

          const meta = document.createElement("div");
          meta.className = "message-meta";
          meta.textContent = formatTime(item.createdAt);

          message.append(text, meta);
          messages.appendChild(message);
        });
    }

    function loadMessages() {
      return WOYSApp.loadMessages({
        onMessages(items) {
          renderMessages(items.concat(agentReplies));
          setError("");
        },
        onError(err) {
          console.error(err);
          setError("Could not load messages.");
        },
      }).catch(() => {});
    }

    function sendMessage(message) {
      sendButton.disabled = true;

      WOYSApp.sendMessage(message, {
        onSent() {
          messageInput.value = "";
        },
        onError(err) {
          console.error(err);
          setError("Could not send message.");
        },
      })
        .then(() => {
          return WOYSApp.getAgentReply(message, {
            onReply(reply) {
              agentReplies.push({
                id: `agent-${Date.now()}`,
                message: reply,
                createdAt: new Date().toISOString(),
                source: "agent",
              });
            },
            onError(err) {
              console.error(err);
              setError("Could not get agent reply.");
            },
          }).catch(() => {});
        })
        .then(() => {
          return loadMessages();
        })
        .catch(() => {})
        .finally(() => {
          sendButton.disabled = false;
          messageInput.focus();
        });
    }

    messageForm.addEventListener("submit", event => {
      event.preventDefault();

      const message = messageInput.value.trim();

      if (message === "") {
        return;
      }

      sendMessage(message);
    });

    loadMessages();
    setInterval(loadMessages, 2000);
  </script>
</body>
</html>
